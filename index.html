<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Director Planner · PMU-B</title>
<meta name="theme-color" content="#141c3a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f9; --panel:#ffffff; --panel2:#f8f9fc; --ink:#18213a; --ink2:#3a4560; --muted:#6c7590; --line:#e2e6ef; --line2:#eef1f6;
  --side:#141c3a; --side2:#1c2650; --sideink:#c3cae0; --sidemut:#7d87a8;
  --accent:#3156d3; --intl:#3156d3; --intl-bg:#e6ecfd; --dom:#0d8a74; --dom-bg:#dff4ef;
  --conf:#d43d36; --conf-bg:#fde9e8; --warn:#b97f00; --warn-bg:#fff4d6; --ok:#1d8a4b; --ok-bg:#e2f5ea;
  --we:#f2f4f8; --today:#fff3c4;
  --shadow:0 1px 2px rgba(20,30,60,.05),0 4px 14px rgba(20,30,60,.05);
  --r:12px; --dw:30px; --lab:230px; --sbw:232px;
  --sans:"IBM Plex Sans Thai","IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --latin:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
html[lang="en"] body{font-family:var(--latin),var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.flg{width:19px;height:14px;object-fit:cover;border-radius:2px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none;display:inline-block}
.flgt{display:inline-block;font:700 10px/14px var(--latin);padding:0 3px;border-radius:3px;background:var(--line);color:var(--ink2);vertical-align:1px}
.gb .flg{box-shadow:0 0 0 1px rgba(255,255,255,.55)}
.gb .flgt{background:rgba(255,255,255,.25);color:inherit}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- language switch ---------- */
.lang{display:inline-flex;border:1px solid var(--line);border-radius:9px;padding:2px;background:var(--panel)}
.lang button{border:0;background:transparent;padding:4px 10px;border-radius:7px;font:600 12.5px var(--latin);color:var(--muted)}
.lang button.on{background:var(--side);color:#fff}

/* ---------- login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1000px 520px at 15% -10%,#2c3f86 0,transparent 60%),var(--side)}
.lcard{position:relative;width:100%;max-width:380px;background:var(--panel);border-radius:18px;padding:34px 28px 28px;box-shadow:0 20px 60px rgba(0,0,0,.35);text-align:center}
.lcard .lang{position:absolute;top:14px;right:14px}
.logo{width:64px;height:64px;border-radius:16px;background:var(--side);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px;margin:0 auto 14px;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain;background:#fff}
.lcard h1{font-size:19px;margin:0 0 2px}
.lcard p{margin:0 0 20px;color:var(--muted);font-size:13px}
.lcard input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);text-align:center;letter-spacing:.08em;font-size:16px}
.lcard .err{color:var(--conf);font-size:13px;min-height:20px;margin-top:6px}
.lcard .note{margin-top:4px}

/* ---------- sidebar (dark) ---------- */
.sb{position:fixed;left:0;top:0;bottom:0;width:var(--sbw);background:var(--side);color:var(--sideink);display:flex;flex-direction:column;z-index:40}
.sbbrand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07)}
.sbbrand .logo{width:40px;height:40px;border-radius:11px;font-size:13px;margin:0;background:rgba(255,255,255,.1)}
.sbbrand b{display:block;color:#fff;font-size:14.5px;line-height:1.3}
.sbbrand span{display:block;font-size:11.5px;color:var(--sidemut)}
.sbnav{padding:14px 10px 6px;display:flex;flex-direction:column;gap:3px}
.sbcap{font:600 10.5px var(--latin);letter-spacing:.1em;text-transform:uppercase;color:var(--sidemut);padding:4px 12px 6px}
.sbi{position:relative;border:0;background:transparent;color:var(--sideink);display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left;width:100%}
.sbi{text-decoration:none}
.sbi:hover{background:rgba(255,255,255,.06);color:#fff}
.sbi.on{background:var(--side2);color:#fff}
.sbi.on::before{content:"";position:absolute;left:-10px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:#7f9cff}
.sbi.add{background:#3156d3;color:#fff;margin-top:4px}
.sbi.add:hover{filter:brightness(1.1)}
.sbsep{height:1px;background:rgba(255,255,255,.07);margin:8px 18px}
.sbfoot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid rgba(255,255,255,.07);display:flex;flex-direction:column;gap:10px;font-size:12px}
.sync{display:flex;align-items:center;gap:8px;border:0;background:rgba(255,255,255,.06);color:var(--sideink);padding:8px 10px;border-radius:9px;text-align:left;font-size:12.5px}
.sync:hover{background:rgba(255,255,255,.1)}
.sync i{width:8px;height:8px;border-radius:50%;background:#8a93ad;flex:none}
.sync.ok i{background:#4cd18a}.sync.dirty i{background:#f5c13d}.sync.busy i{background:#7fb0ff;animation:pulse 1s infinite}.sync.err i{background:#ff6b63}
@keyframes pulse{50%{opacity:.3}}
.d3b{display:flex;align-items:center;justify-content:center;gap:8px;padding:9px 10px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:var(--sideink);text-decoration:none;font-size:13px;font-weight:500}
.d3b:hover{background:rgba(255,255,255,.12);color:#fff}
.d3b svg.i{width:16px;height:16px}
.sbmeta{color:var(--sidemut);line-height:1.5}
.sbmeta b{color:var(--sideink);font-weight:600}
.sbout{border:0;background:transparent;color:var(--sidemut);display:flex;gap:8px;align-items:center;padding:4px 2px;font-size:12.5px}
.sbout:hover{color:#ff9a94}
.scrim{display:none}

/* ---------- top bar & main ---------- */
.wrap{margin-left:var(--sbw);min-width:0}
.topbar{position:sticky;top:0;z-index:30;background:rgba(244,245,249,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:12px;padding:12px 24px}
.hamb{display:none;border:1px solid var(--line);background:var(--panel);width:38px;height:38px;border-radius:10px;place-items:center;color:var(--ink)}
.ptitle{flex:1;min-width:0}
.ptitle h1{margin:0;font-size:19px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptitle span{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-weight:500;white-space:nowrap;color:var(--ink2)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.danger{color:var(--conf);border-color:transparent;background:transparent}
.btn.sm{padding:6px 11px;font-size:13px}
.btn svg.i{width:16px;height:16px}
main{padding:18px 24px 60px}
.banner{border-radius:10px;padding:9px 14px;margin-bottom:12px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.ro{background:var(--panel);border:1px dashed var(--line);color:var(--muted)}
.banner.dirty{background:var(--warn-bg)}

/* overview */
.overview{display:grid;grid-template-columns:1.25fr 2fr;gap:12px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.next{padding:16px 18px;display:flex;flex-direction:column;gap:6px;cursor:pointer}
.next:hover{border-color:#c9d3f3}
.lbl{font:600 11.5px var(--latin);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
html[lang="th"] .lbl{font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:12.5px}
.next .t{font-size:18px;font-weight:600;line-height:1.35}
.next .m{color:var(--ink2);font-size:13px}
.next .cdn{align-self:flex-start;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--intl-bg);color:var(--intl)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.kpi{padding:14px 16px}
.kpi .v{font:700 26px/1.1 var(--latin)}
.kpi .k{font-size:13px;color:var(--ink2);margin-top:6px}
.kpi .k small{display:block;color:var(--muted);font-size:11.5px}
.kpi.bad .v{color:var(--conf)}
.kpi.bad{cursor:pointer}

/* toolbar */
.toolbar{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-bottom:10px}
.nav{display:inline-flex;align-items:center;gap:4px}
.nav .lab{min-width:150px;text-align:center;font-weight:600}
.nav .ar{border:1px solid var(--line);background:var(--panel);width:32px;height:32px;border-radius:8px}
.chips{display:inline-flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-size:13px;display:inline-flex;gap:7px;align-items:center;color:var(--muted)}
.chip .dot{width:9px;height:9px;border-radius:3px;opacity:.35}
.chip.on{border-color:var(--ink2);color:var(--ink);background:var(--panel)}
.chip.on .dot{opacity:1}
.chip .ck{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;color:#fff}
.chip.on .ck{background:var(--ink2);border-color:var(--ink2)}
.chip.on .ck::after{content:"✓"}
.vsep{width:1px;height:22px;background:var(--line);margin:0 2px}
.search{min-width:180px;width:240px;padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel)}
.spacer{flex:1}
.tools{display:inline-flex;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 12px 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:10px;border-radius:3px;display:inline-block}
.sw.intl{background:var(--intl)}.sw.dom{background:var(--dom)}
.sw.tent{background:repeating-linear-gradient(135deg,var(--intl) 0 3px,transparent 3px 6px);border:1px dashed var(--intl)}
.sw.c{background:var(--conf)}.sw.h{background:var(--warn)}

/* ---------- timeline ---------- */
.gwrap{overflow:auto;max-height:calc(100vh - 120px);border-radius:var(--r);border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);overscroll-behavior:contain}
.gantt{display:grid;position:relative;min-width:max-content}
.gm,.gd,.go,.gc{position:sticky;background:var(--panel);z-index:4}
.gm{top:0;height:28px;font-size:12px;font-weight:600;padding:5px 8px;border-bottom:1px solid var(--line);border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.gd{top:28px;height:40px;border-bottom:1px solid var(--line);text-align:center;font-family:var(--latin);line-height:1.1;padding-top:5px}
.gd b{display:block;font-size:13px;font-weight:600}.gd i{font-style:normal;font-size:10px;color:var(--muted);font-family:var(--sans)}
.gd.we{background:var(--we)}.gd.td b{background:var(--accent);color:#fff;border-radius:6px;display:inline-block;padding:0 4px}
.gd.m1{border-left:1px solid var(--line)}
.go{top:68px;height:24px;border-bottom:2px solid var(--line);display:grid;place-items:center;font:700 10.5px var(--latin)}
.go.n1{background:var(--line2)}
.go.c{background:var(--conf);color:#fff}.go.h{background:var(--warn);color:#fff;font-family:var(--sans)}
.gc{left:0;z-index:6;border-right:1px solid var(--line)}
.gc.corner{top:0;display:flex;flex-direction:column;justify-content:flex-end;padding:6px 12px;font-size:12px;color:var(--muted);border-bottom:2px solid var(--line);z-index:8}
.gc.corner b{color:var(--ink);font-size:13px}
.gbg{z-index:0}.gbg.we{background:var(--we)}.gbg.td{background:var(--today);opacity:.7}
.gbg.m1{border-left:1px solid var(--line)}
.grow{border-bottom:1px solid var(--line2);z-index:1;pointer-events:none}
.gl{position:sticky;left:0;z-index:5;background:var(--panel);border-right:1px solid var(--line);border-bottom:1px solid var(--line2);padding:5px 12px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;min-width:0}
.gl:hover{background:var(--panel2)}
.gl .n{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gl .d{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.w{color:var(--conf)}
.gb{z-index:2;align-self:center;height:26px;margin:0 2px;border-radius:7px;color:#fff;font-size:12px;font-weight:500;padding:0 8px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.12);transition:transform .1s}
.gb:hover{transform:translateY(-1px);filter:brightness(1.06)}
.gb.intl{background:var(--intl)}.gb.dom{background:var(--dom)}
.gb.tent.intl{background:repeating-linear-gradient(135deg,var(--intl-bg) 0 6px,var(--panel) 6px 12px);color:var(--intl);border:1.5px dashed var(--intl)}
.gb.tent.dom{background:repeating-linear-gradient(135deg,var(--dom-bg) 0 6px,var(--panel) 6px 12px);color:var(--dom);border:1.5px dashed var(--dom)}
.gb.canc{background:var(--line);color:var(--muted);text-decoration:line-through;box-shadow:none}
.gb.cf{outline:2px solid var(--conf);outline-offset:1px}
.gb.cl{border-top-left-radius:0;border-bottom-left-radius:0;margin-left:0}
.gb.cr{border-top-right-radius:0;border-bottom-right-radius:0;margin-right:0}
.gb .pl{opacity:.75}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- calendar ---------- */
.cal{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.cgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.ch{padding:8px;font-size:12px;color:var(--muted);text-align:center;border-bottom:1px solid var(--line);font-weight:600}
.cd{min-height:112px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.cd:nth-child(7n){border-right:0}
.cd.out{background:var(--panel2)}.cd.out .dn{opacity:.4}
.cd.we{background:var(--we)}
.cd.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.cd .dh{display:flex;justify-content:space-between;align-items:center;font-family:var(--latin)}
.cd .dn{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:7px}
.cd.td .dn{background:var(--accent);color:#fff}
.cd .bd{font-size:10px;font-weight:700;padding:1px 6px;border-radius:999px;font-family:var(--sans)}
.cd .bd.c{background:var(--conf);color:#fff}.cd .bd.h{background:var(--warn);color:#fff}
.ce{font-size:11.5px;line-height:1.3;padding:2px 6px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.ce.intl{background:var(--intl)}.ce.dom{background:var(--dom)}
.ce.tent.intl{background:var(--intl-bg);color:var(--intl);border:1px dashed var(--intl)}
.ce.tent.dom{background:var(--dom-bg);color:var(--dom);border:1px dashed var(--dom)}
.ce.cont{opacity:.7}
.ce.more{background:transparent;color:var(--muted);padding-left:2px}
.ce .flg{width:15px;height:11px;vertical-align:-1px}
.dayp{margin-top:12px}

/* ---------- list ---------- */
.mh{display:flex;align-items:baseline;gap:10px;margin:18px 4px 8px}
.mh:first-child{margin-top:4px}
.mh h3{margin:0;font-size:16px}
.mh .sub{font-size:13px;color:var(--muted)}
.mh .cnt{margin-left:auto;font-size:12px;color:var(--muted)}
.li{display:grid;grid-template-columns:132px 1fr auto;gap:14px;align-items:start;padding:12px 16px 12px 18px;border-bottom:1px solid var(--line2);cursor:pointer;position:relative}
.li:last-child{border-bottom:0}
.li:hover{background:var(--panel2)}
.li::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--intl)}
.li.dom::before{background:var(--dom)}
.li.tent::before{background:repeating-linear-gradient(180deg,var(--intl) 0 4px,transparent 4px 7px)}
.li.dom.tent::before{background:repeating-linear-gradient(180deg,var(--dom) 0 4px,transparent 4px 7px)}
.li.canc{opacity:.55}.li.canc .lt{text-decoration:line-through}
.li.past{opacity:.6}
.dt{font-weight:600;line-height:1.3}
.dt small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.lt{font-size:15px;font-weight:600;line-height:1.35}
.lm{color:var(--ink2);font-size:13px;margin-top:2px;display:flex;flex-wrap:wrap;gap:4px 14px}
.lw{margin-top:6px;display:flex;flex-direction:column;gap:4px}
.warn{font-size:12.5px;padding:4px 9px;border-radius:7px;display:inline-flex;gap:6px;align-items:flex-start;width:fit-content;max-width:100%}
.warn.c{background:var(--conf-bg);color:var(--conf)}.warn.h{background:var(--warn-bg);color:var(--warn)}
.pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.confirmed{background:var(--ok-bg);color:var(--ok)}
.pill.tentative{background:var(--warn-bg);color:var(--warn)}
.pill.cancelled{background:var(--line);color:var(--muted)}
.tag{font:600 11px var(--latin);padding:2px 8px;border-radius:6px}
.tag.intl{background:var(--intl-bg);color:var(--intl)}.tag.dom{background:var(--dom-bg);color:var(--dom)}
.lr{display:flex;flex-direction:column;align-items:flex-end;gap:6px}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;background:rgba(10,15,30,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;overflow:auto}
.modal{background:var(--panel);width:100%;max-width:640px;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.mhd{display:flex;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.mhd h2{margin:0;font-size:17px;flex:1}
.mhd .x{border:0;background:transparent;font-size:22px;color:var(--muted);width:32px;height:32px}
.mbd{padding:16px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.f input,.f textarea{padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);width:100%;min-width:0}
.f input:focus,.f textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.f textarea{min-height:64px;resize:vertical}
.f input:disabled,.f textarea:disabled{opacity:.9;background:transparent;border-style:dashed}
.typesel{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.typesel button{padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--panel2);font-weight:600;text-align:left;display:flex;flex-direction:column}
.typesel button small{font-weight:400;color:var(--muted);font-size:11.5px}
.typesel button.on.intl{border-color:var(--intl);background:var(--intl-bg);color:var(--intl)}
.typesel button.on.dom{border-color:var(--dom);background:var(--dom-bg);color:var(--dom)}
.stsel{display:flex;gap:6px;flex-wrap:wrap}
.stsel button{border:1.5px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:999px;font-size:13px}
.stsel button.on.confirmed{border-color:var(--ok);background:var(--ok-bg);color:var(--ok)}
.stsel button.on.tentative{border-color:var(--warn);background:var(--warn-bg);color:var(--warn)}
.stsel button.on[data-w]{border-color:var(--accent);background:var(--intl-bg);color:var(--accent)}
.stsel button.on.cancelled{border-color:var(--muted);background:var(--line);color:var(--ink2)}
/* delegation picker */
.f{position:relative}
.pick{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);min-height:42px;cursor:text}
.pick:focus-within{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.pick #fWithChips{display:contents}
.pick input{border:0!important;outline:0!important;background:transparent!important;padding:4px!important;flex:1;min-width:140px;width:auto!important}
.pchip{display:inline-flex;align-items:center;gap:6px;background:var(--intl-bg);color:var(--accent);border-radius:999px;padding:3px 6px 3px 11px;font-size:13px;font-weight:500}
.pchip small{color:var(--muted);font-weight:400}
.pchip button{border:0;background:rgba(49,86,211,.12);color:var(--accent);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;display:grid;place-items:center;padding:0}
.pchip button:hover{background:var(--accent);color:#fff}
.pick.ro{background:transparent;border-style:dashed;cursor:default}.pick.ro input,.pick.ro .pchip button{display:none}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:-18px;z-index:5;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(20,30,60,.15);max-height:260px;overflow:auto;padding:4px}
.sugg button{display:flex;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:7px;gap:10px;align-items:center}
.sugg button:hover,.sugg button.hi{background:var(--intl-bg)}
.sugg .av{width:28px;height:28px;border-radius:50%;background:var(--side);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.sugg .nm{font-size:13.5px;font-weight:500;line-height:1.3}.sugg .nm small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}
.sugg .tag{margin-left:auto}
#fWithSrc{font-size:11.5px;margin-top:2px}
#fWarn{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
#fWarn:empty{display:none}
.mft{display:flex;gap:8px;padding:14px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
.meta{font-size:11.5px;color:var(--muted);grid-column:1/-1}
.drawer .mbd{grid-template-columns:1fr}
.sec{font:700 11.5px var(--latin);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:12.5px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;z-index:90;font-size:13.5px;box-shadow:var(--shadow);max-width:90vw}

/* ---------- responsive ---------- */
@media (max-width:1100px){ .overview{grid-template-columns:1fr} }
@media (max-width:900px){
  .wrap{margin-left:0}
  .sb{transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.3);width:270px;max-width:86vw}
  body.sbo .sb{transform:none}
  body.sbo .scrim{display:block;position:fixed;inset:0;background:rgba(10,15,30,.45);z-index:35}
  .hamb{display:grid}
  .topin{padding:10px 14px;gap:10px}
  main{padding:14px 14px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:640px){
  :root{--dw:28px;--lab:128px}
  .ptitle h1{font-size:16px}.ptitle span{display:none}
  .topadd .tx{display:none}
  .kpi{padding:10px 12px}.kpi .v{font-size:22px}
  .search{width:100%;order:20}
  .tools .tx{display:none}
  .vsep{display:none}
  .nav .lab{min-width:112px;font-size:13px}
  .legend span:nth-child(n+4){display:none}
  .gl{padding:4px 8px}.gl .n{font-size:12px}
  .cd{min-height:64px;padding:3px}
  .ce{font-size:0;height:6px;padding:0;border-radius:3px}
  .ce .flg,.ce.more{display:none}
  .li{grid-template-columns:1fr;gap:4px;padding:12px 14px 12px 18px}
  .lr{flex-direction:row;align-items:center;justify-content:flex-start}
  .mbd{grid-template-columns:1fr}
  .ov{padding:0}
  .modal{border-radius:0;min-height:100vh}
}
@media print{
  .sb,.topbar,.toolbar,.overview,.banner,.legend{display:none!important}
  .wrap{margin:0}
  body{background:#fff}
  .card,.gwrap,.cal{box-shadow:none}
  .gwrap{max-height:none;overflow:visible}
  .li{break-inside:avoid}
}
</style>

/* =====================================================================
   Overlap engine
   ===================================================================== */
var OV = {pairs:{},day:{}};
function computeOverlaps(){
  var act=live().filter(function(i){return i.status!=='cancelled'&&i.start&&i.end});
  var pairs={},day={};
  act.forEach(function(it){for(var n=dn(it.start);n<=dn(it.end);n++){day[n]=day[n]||{n:0,c:false,h:false,ids:[]};day[n].n++;day[n].ids.push(it.id)}});
  for(var i=0;i<act.length;i++)for(var j=i+1;j<act.length;j++){
    var a=act[i],b=act[j],s=Math.max(dn(a.start),dn(b.start)),e=Math.min(dn(a.end),dn(b.end));
    if(s>e) continue;
    var hand=(s===e)&&(a.end===b.start||b.end===a.start)&&a.start!==a.end&&b.start!==b.end;
    var kind=hand?'h':'c';
    (pairs[a.id]=pairs[a.id]||[]).push({o:b,k:kind,s:s,e:e});
    (pairs[b.id]=pairs[b.id]||[]).push({o:a,k:kind,s:s,e:e});
    for(var n=s;n<=e;n++){ if(kind==='c')day[n].c=true; else day[n].h=true; }
  }
  OV={pairs:pairs,day:day};
}
function hasConflict(it){return (OV.pairs[it.id]||[]).some(function(p){return p.k==='c'})}
function warnLine(kind,title,range){
  return kind==='c'
    ? '<span class="warn c">⚠ '+t('overlapWith')+' “'+esc(title)+'” ('+range+')</span>'
    : '<span class="warn h">↔ '+t('sameDay')+' “'+esc(title)+'” ('+range+') — '+t('checkFlight')+'</span>';
}
function warnHTML(it){
  return (OV.pairs[it.id]||[]).map(function(p){return warnLine(p.k,p.o.title,p.s===p.e?fmtD(p.s):fmtD(p.s)+'–'+fmtD(p.e))}).join('');
}

  var q=($('#q').value||'').trim().toLowerCase();

    if(!UI.types[i.type]) return false;
    if(!UI.showCanc && i.status==='cancelled') return false;
    if(q){var h=[i.title,i.country,i.province,i.venue,i.coord,i.with,i.notes].join(' ').toLowerCase();if(h.indexOf(q)<0)return false}
    return true;
  }).sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:(a.end<b.end?-1:1)});

/* =====================================================================

   ===================================================================== */
function renderTimeline(){
  var S=cursor, E=monthEnd(addMonths(cursor,1)), N=E-S+1, T=todayN();
  var rows=filtered().filter(function(i){return dn(i.end)>=S&&dn(i.start)<=E});
  var R=rows.length, h=[];
  h.push('<div class="gwrap" id="gwrap"><div class="gantt" style="grid-template-columns:var(--lab) repeat('+N+',var(--dw));grid-template-rows:28px 40px 24px'+(R?' repeat('+R+',44px)':'')+'">');
  h.push('<div class="gc corner" style="grid-column:1;grid-row:1/4"><b>'+t('colAct')+'</b>'+t('nItems',{n:R})+'</div>');
  var m=S; while(m<=E){var me=Math.min(monthEnd(m),E);h.push('<div class="gm" style="grid-column:'+(m-S+2)+'/'+(me-S+3)+';grid-row:1">'+monthTitle(m)+'</div>');m=me+1}
  for(var n=S;n<=E;n++){
    var p=parts(n),c=n-S+2,we=(p.w===0||p.w===6),m1=(p.d===1&&n!==S),cls=(we?' we':'')+(n===T?' td':'')+(m1?' m1':'');
    h.push('<div class="gd'+cls+'" style="grid-column:'+c+';grid-row:2"><b>'+p.d+'</b><i>'+wd(p.w)+'</i></div>');
    var o=OV.day[n], oc='', ot='';
    if(o){ if(o.c){oc=' c';ot=o.n} else if(o.h){oc=' h';ot=t('transitShort')} else oc=' n1'; }
    h.push('<div class="go'+oc+'" style="grid-column:'+c+';grid-row:3" title="'+esc(o?dayTip(n):'')+'">'+ot+'</div>');
    if(R&&(we||n===T||m1)) h.push('<div class="gbg'+cls+'" style="grid-column:'+c+';grid-row:4/span '+R+'"></div>');
  }
  rows.forEach(function(it,ix){
    var r=ix+4, a=dn(it.start), b=dn(it.end), cs=Math.max(a,S), ce=Math.min(b,E);
    var cf=hasConflict(it), canc=it.status==='cancelled', tent=it.status==='tentative';
    h.push('<div class="grow" style="grid-column:2/-1;grid-row:'+r+'"></div>');
    h.push('<div class="gl" style="grid-column:1;grid-row:'+r+'" data-id="'+it.id+'"><div class="n">'+(cf?'<span class="w">⚠ </span>':'')+flagImg(it)+' '+esc(it.title)+'</div><div class="d">'+fmtRange(a,b)+(tent?' · '+t('tentative'):'')+(canc?' · '+t('cancelled'):'')+'</div></div>');
    var bc='gb '+it.type+(tent?' tent':'')+(canc?' canc':'')+(cf?' cf':'')+(a<S?' cl':'')+(b>E?' cr':'');
    var place=it.type==='intl'?(it.venue||it.country||''):(it.venue||it.province||'');
    h.push('<div class="'+bc+'" style="grid-column:'+(cs-S+2)+'/'+(ce-S+3)+';grid-row:'+r+'" data-id="'+it.id+'" title="'+esc(it.title+' · '+fmtRange(a,b)+(placeOf(it)?' · '+placeOf(it):''))+'">'+flagImg(it)+(ce-cs>=1?' '+esc(it.title):'')+(place&&ce-cs>=3?' <span class="pl">· '+esc(place)+'</span>':'')+'</div>');
  });
  h.push('</div>');
  if(!R) h.push('<div class="empty">'+t('emptyRange')+'</div>');
  h.push('</div>');
  $('#view').innerHTML=h.join('');
  var gw=$('#gwrap'); if(T>=S&&T<=E&&gw){var dw=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--dw'))||30;gw.scrollLeft=Math.max(0,(T-S-3)*dw)}
}

function renderCalendar(){

  var ws=UI.weekStart, first=S-((parts(S).w-ws+7)%7), last=E+(6-(parts(E).w-ws+7)%7);

  for(var n=first;n<=last;n++){
    var p=parts(n),out=n<S||n>E,we=p.w===0||p.w===6;
    var evs=items.filter(function(i){return dn(i.start)<=n&&dn(i.end)>=n});

    evs.slice(0,3).forEach(function(i){

  }
  h.push('</div></div>');

    var de=items.filter(function(i){return dn(i.start)<=selDay&&dn(i.end)>=selDay});

  }
  $('#view').innerHTML=h.join('');
}

/* =====================================================================
   Delegation picker — รายชื่อ บพค. จากระบบนามบัตร (MeetingCard)
   อ่านจากที่เก็บข้อมูลในเครื่องของ MeetingCard (โดเมนเดียวกัน) แบบอ่านอย่างเดียว
   ===================================================================== */
var PEOPLE=[], PEOPLE_MC=0, wsHi=-1;
function mcIdbRead(){
  return new Promise(function(res){
    try{
      if(!window.indexedDB) return res(null);
      var go=function(){
        var req; try{req=indexedDB.open('pmub-meetingcard',1)}catch(e){return res(null)}
        req.onupgradeneeded=function(){try{req.transaction.abort()}catch(e){}};   // ไม่มีฐานข้อมูล — ห้ามสร้างใหม่
        req.onerror=function(){res(null)}; req.onblocked=function(){res(null)};
        req.onsuccess=function(){
          var db=req.result;
          try{
            if(!db.objectStoreNames.contains('kv')){db.close();return res(null)}
            var g=db.transaction('kv','readonly').objectStore('kv').get('mc:participants');
            g.onsuccess=function(){db.close();try{res(g.result?JSON.parse(g.result):null)}catch(e){res(null)}};
            g.onerror=function(){db.close();res(null)};
          }catch(e){try{db.close()}catch(x){}res(null)}
        };
      };
      if(indexedDB.databases) indexedDB.databases().then(function(l){if(l.some(function(d){return d.name==='pmub-meetingcard'}))go();else res(null)},function(){res(null)});
      else res(null);
    }catch(e){res(null)}
  });
}
function loadPeople(){
  return mcIdbRead().then(function(list){
    if(!list){try{list=JSON.parse(localStorage.getItem('mc:participants')||'null')}catch(e){list=null}}
    var mc=[];
    if(Array.isArray(list)) list.forEach(function(p){
      if(!p||p.deleted) return;
      var th=(p.nameLocal||'').trim(), enn=(p.name||'').trim();
      if(!th&&!enn) return;
      mc.push({th:th||enn,en:enn||th,pos:[p.position,p.division].filter(Boolean).join(' · '),src:'mc'});
    });
    if(mc.length) ls('dap.people',mc); else mc=ls('dap.people')||[];
    PEOPLE_MC=mc.length;
    var seen={}; mc.forEach(function(p){seen[p.th]=seen[p.en]=1});
    var used=[];
    live().forEach(function(i){withSplit(i.with).forEach(function(n){if(!seen[n]){seen[n]=1;used.push({th:n,en:n,pos:'',src:'used'})}})});
    PEOPLE=mc.concat(used);
    return PEOPLE;
  });
}
function withSplit(v){return String(v||'').split(/\s*[,;\n]\s*/).map(function(x){return x.trim()}).filter(Boolean)}
function withGet(){return withSplit($('#fWith').value)}
function withSet(arr){$('#fWith').value=arr.join(', ');withRender()}
function pName(p){return en()?p.en:p.th}
function withRender(){
  var ro=!canEdit();
  $('#fWithBox').classList.toggle('ro',ro);
  $('#fWithChips').innerHTML=withGet().map(function(n,ix){
    var p=PEOPLE.filter(function(x){return x.th===n||x.en===n})[0];
    return '<span class="pchip">'+esc(n)+(p&&p.pos?' <small>'+esc(p.pos.split(' · ')[0])+'</small>':'')+'<button type="button" data-rm="'+ix+'" aria-label="remove">×</button></span>';
  }).join('');
}
function withSrcNote(){$('#fWithSrc').textContent=PEOPLE_MC?t('withSrcMc',{n:PEOPLE_MC}):t('withSrcNone');withRender()}
function withSuggest(){
  var box=$('#fWithSug'), q=$('#fWithIn').value.trim().toLowerCase(), cur=withGet();
  if(!canEdit()){box.classList.add('hidden');return}
  var list=PEOPLE.filter(function(p){return cur.indexOf(p.th)<0&&cur.indexOf(p.en)<0&&(!q||(p.th+' '+p.en+' '+p.pos).toLowerCase().indexOf(q)>-1)}).slice(0,8);
  var h=list.map(function(p,ix){var n=pName(p);return '<button type="button" data-pick="'+esc(n)+'" class="'+(ix===wsHi?'hi':'')+'"><span class="av">'+esc(n.replace(/^(ดร\.|ผศ\.|รศ\.|ศ\.|นาย|นางสาว|นาง|Dr\.?|Mr\.?|Ms\.?|Mrs\.?)\s*/,'').charAt(0).toUpperCase())+'</span><span class="nm">'+esc(n)+(p.pos?'<small>'+esc(p.pos)+'</small>':'')+'</span>'+(p.src==='used'?'<span class="tag dom">'+t('withUsed')+'</span>':'')+'</button>'}).join('');
  var raw=$('#fWithIn').value.trim();
  if(raw&&!list.some(function(p){return pName(p)===raw})) h+='<button type="button" data-pick="'+esc(raw)+'"><span class="av">＋</span><span class="nm">'+esc(t('withAdd',{x:raw}))+'</span></button>';
  box.innerHTML=h; box.classList.toggle('hidden',!h);
}
function withAdd(n){n=String(n||'').trim();if(!n)return;var c=withGet();if(c.indexOf(n)<0)c.push(n);withSet(c);$('#fWithIn').value='';wsHi=-1;withSuggest();$('#fWithIn').focus()}
function bindWith(){
  var inp=$('#fWithIn'), box=$('#fWithSug');
  $('#fWithBox').addEventListener('click',function(e){var b=e.target.closest('[data-rm]');if(b){var c=withGet();c.splice(+b.dataset.rm,1);withSet(c);return}inp.focus()});
  inp.addEventListener('focus',function(){wsHi=-1;withSuggest()});
  inp.addEventListener('input',function(){wsHi=-1;withSuggest()});
  inp.addEventListener('keydown',function(e){
    var items=$$('#fWithSug button');
    if(e.key==='ArrowDown'){e.preventDefault();wsHi=Math.min(wsHi+1,items.length-1);withSuggest()}
    else if(e.key==='ArrowUp'){e.preventDefault();wsHi=Math.max(wsHi-1,-1);withSuggest()}
    else if(e.key==='Enter'||e.key===','){e.preventDefault();e.stopPropagation();if(wsHi>-1&&items[wsHi])withAdd(items[wsHi].dataset.pick);else withAdd(inp.value)}
    else if(e.key==='Backspace'&&!inp.value){var c=withGet();c.pop();withSet(c)}
    else if(e.key==='Escape'){e.stopPropagation();box.classList.add('hidden')}
  });
  box.addEventListener('mousedown',function(e){var b=e.target.closest('[data-pick]');if(b){e.preventDefault();withAdd(b.dataset.pick)}});
  inp.addEventListener('blur',function(){setTimeout(function(){box.classList.add('hidden');if(inp.value.trim())withAdd(inp.value)},150)});
}

function liveWarn(){

  if($('#fWithIn').value.trim()) withAdd($('#fWithIn').value);

  if(!ti){toast(t('needTitle'));$('#fTitle').focus();return}

    country:fType==='intl'?$('#fCountry').value.trim():'',province:fType==='dom'?$('#fProvince').value.trim():'',
    venue:$('#fVenue').value.trim(),time:$('#fTime').value.trim(),coord:$('#fCoord').value.trim(),with:$('#fWith').value.trim(),
    travel:fType==='intl'?$('#fTravel').value.trim():'',notes:$('#fNotes').value.trim(),link:$('#fLink').value.trim(),updatedAt:nowISO()};
  var isNew=!editing;
  if(editing){Object.assign(editing,rec)} else {rec.id=uid();rec.createdAt=rec.updatedAt;DB.items.push(rec)}
  if(isNew) cursor=monthStart(dn(s));

}
function delEdit(){
  if(!editing) return;
  var b=$('#delBtn');
  if(b.dataset.confirm!=='1'){b.dataset.confirm='1';b.textContent=t('delConfirm');setTimeout(function(){b.dataset.confirm='';b.textContent=t('del')},3000);return}
  editing.deleted=true; editing.updatedAt=nowISO(); commit(); closeOv(); toast(t('deleted'));
}
function dupEdit(){if(!editing)return;var c=JSON.parse(JSON.stringify(editing));delete c.id;c.title=c.title+t('copySuffix');closeOv();openEdit(null,c)}
function commit(){DB.dirty=true;saveDB();render();schedulePush()}

/* =====================================================================
   Sync — GitHub Gist
   ===================================================================== */
var syncState='idle', pushTimer=null;
function locale(){return en()?'en-GB':'th-TH'}
function syncPill(){
  var p=$('#syncPill'), x=$('#syncTxt'); p.className='sync';
  if(!CFG.gist) x.textContent=t('sLocal');
  else if(syncState==='busy'){p.classList.add('busy');x.textContent=t('sBusy')}
  else if(syncState==='err'){p.classList.add('err');x.textContent=t('sErr')}
  else if(DB.dirty&&CFG.token){p.classList.add('dirty');x.textContent=t('sDirty')}
  else {p.classList.add('ok');x.textContent=t('sOk')}
  $('#lastSync').textContent=DB.lastSync?t('lastSync')+' '+new Date(DB.lastSync).toLocaleString(locale(),{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):(CFG.gist?t('neverSync'):t('noSync'));
}
function ghHeaders(){var h={'Accept':'application/vnd.github+json'};if(CFG.token)h['Authorization']='Bearer '+CFG.token;return h}
function fetchRemote(){
  return fetch('https://api.github.com/gists/'+encodeURIComponent(CFG.gist)+'?t='+Date.now(),{headers:ghHeaders(),cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()})
  .then(function(g){
    var f=g.files&&g.files[GIST_FILE];
    if(!f) return {items:[],updated:g.updated_at,hasFile:false};
    var p=f.truncated?fetch(f.raw_url,{cache:'no-store'}).then(function(r){return r.text()}):Promise.resolve(f.content);
    return p.then(function(txt){var j;try{j=JSON.parse(txt||'{}')}catch(e){throw new Error(t('tCorrupt'))}return {items:j.items||[],updated:g.updated_at,hasFile:true}});
  });
}
function mergeItems(local,remote){
  var map={};
  remote.forEach(function(r){map[r.id]=r});
  local.forEach(function(l){var r=map[l.id];if(!r||(l.updatedAt||'')>(r.updatedAt||''))map[l.id]=l});
  return Object.keys(map).map(function(k){return map[k]});
}
function sig(){return JSON.stringify(live().map(function(i){return [i.id,i.updatedAt]}).sort())}
function pull(silent){
  if(!CFG.gist) return Promise.resolve();
  syncState='busy'; syncPill();
  return fetchRemote().then(function(rm){
    var before=sig();
    if(!rm.hasFile && DB.items.length && CFG.token) DB.dirty=true;
    else if(DB.dirty) DB.items=mergeItems(DB.items,rm.items);
    else DB.items=rm.items.slice();
    DB.remoteUpdated=rm.updated; DB.lastSync=nowISO(); syncState='idle'; saveDB();
    var changed=before!==sig();
    render();
    if(!silent) toast(t('tPulled')); else if(changed) toast(t('tNew'));
    if(DB.dirty&&CFG.token) return push();
  }).catch(function(e){syncState='err';syncPill();if(!silent)toast(t('tPullFail')+e.message,4000)});
}
function payload(){return JSON.stringify({app:'pmub-director-planner',version:APP_VERSION,updatedAt:nowISO(),items:DB.items},null,1)}
function push(){
  if(!CFG.gist||!CFG.token) return Promise.resolve();
  syncState='busy'; syncPill();
  return fetchRemote().then(function(rm){
    DB.items=mergeItems(DB.items,rm.items);
    var body={files:{}}; body.files[GIST_FILE]={content:payload()};
    return fetch('https://api.github.com/gists/'+encodeURIComponent(CFG.gist),{method:'PATCH',headers:Object.assign(ghHeaders(),{'Content-Type':'application/json'}),body:JSON.stringify(body)});
  }).then(function(r){
    if(!r.ok) throw new Error(r.status===401||r.status===403?t('tBadToken'):'HTTP '+r.status);
    return r.json();
  }).then(function(g){
    DB.dirty=false; DB.lastSync=nowISO(); DB.remoteUpdated=g.updated_at; syncState='idle'; saveDB(); render();
  }).catch(function(e){syncState='err';render();toast(t('tPushFail',{e:e.message}),4500)});
}
function schedulePush(){if(!CFG.gist||!CFG.token)return;clearTimeout(pushTimer);pushTimer=setTimeout(push,800)}
function createGist(){
  if(!CFG.token){toast(t('tNeedToken'));return}
  var body={description:'PMU-B Director Activity Planner data',public:false,files:{}};
  body.files[GIST_FILE]={content:payload()};
  fetch('https://api.github.com/gists',{method:'POST',headers:Object.assign(ghHeaders(),{'Content-Type':'application/json'}),body:JSON.stringify(body)})
  .then(function(r){if(!r.ok)throw new Error(r.status===401||r.status===403?t('tBadToken'):'HTTP '+r.status);return r.json()})
  .then(function(g){CFG.gist=g.id;ls(K.cfg,CFG);$('#sGist').value=g.id;DB.dirty=false;DB.lastSync=nowISO();saveDB();render();setInfo();toast(t('tGist',{id:g.id}),9000)})
  .catch(function(e){toast(t('tGistFail')+e.message,4000)});
}

/* =====================================================================
   Export / import / share text
   ===================================================================== */
function download(name,txt,type){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500)}
function exportJSON(){download('pmub_director_activities_'+ds(todayN())+'.json',JSON.stringify({app:'pmub-director-planner',version:APP_VERSION,exportedAt:nowISO(),items:DB.items},null,1),'application/json')}
function exportCSV(){
  var cols=[['ID','id'],['Type ประเภท','type'],['Activity กิจกรรม','title'],['Start เริ่ม','start'],['End สิ้นสุด','end'],['Days วัน',null],['Country ประเทศ','country'],['Province จังหวัด','province'],['City/Venue สถานที่','venue'],['Status สถานะ','status'],['Time เวลา','time'],['Coordinator ผู้ประสาน','coord'],['Delegation ผู้ร่วมเดินทาง','with'],['Travel การเดินทาง','travel'],['Notes หมายเหตุ','notes'],['Overlap วันซ้อน',null],['Link','link']];
  computeOverlaps();
  var rows=[cols.map(function(c){return c[0]})];
  live().sort(function(a,b){return a.start<b.start?-1:1}).forEach(function(it){
    rows.push(cols.map(function(c){
      if(c[0].indexOf('Days')===0) return dn(it.end)-dn(it.start)+1;
      if(c[0].indexOf('Overlap')===0) return (OV.pairs[it.id]||[]).map(function(p){return (p.k==='c'?'Conflict ซ้อน: ':'Transit ต่อเนื่อง: ')+p.o.title}).join('; ');
      if(c[1]==='type') return it.type==='intl'?'International':'Domestic';
      return it[c[1]]||'';
    }));
  });
  var csv=rows.map(function(r){return r.map(function(v){v=String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')}).join('\r\n');
  download('pmub_director_activities_'+ds(todayN())+'.csv','﻿'+csv,'text/csv;charset=utf-8');
}
function importJSON(file){
  var r=new FileReader();
  r.onload=function(){try{var j=JSON.parse(r.result),its=j.items||j;if(!Array.isArray(its))throw 0;
    its.forEach(function(i){if(!i.id)i.id=uid();if(!i.updatedAt)i.updatedAt=nowISO()});
    DB.items=mergeItems(DB.items,its);commit();toast(t('tImported',{n:its.length}))}catch(e){toast(t('tBadFile'))}};
  r.readAsText(file);
}
function shareText(){
  var T=todayN(),act=live().filter(function(i){return i.status!=='cancelled'&&dn(i.end)>=T}).sort(function(a,b){return a.start<b.start?-1:1});
  computeOverlaps();
  var L=[t('shareHead',{d:fmtD(T,1)}),''],cm=null;
  act.forEach(function(i){
    var m=monthStart(dn(i.start)); if(m!==cm){cm=m;L.push('▪ '+monthTitle(m))}
    L.push('• '+fmtRange(dn(i.start),dn(i.end))+'  '+flagText(i)+' '+i.title+(placeOf(i)?' — '+placeOf(i):'')+(i.status==='tentative'?t('shareTent'):'')+(hasConflict(i)?t('shareConf'):''));
  });
  return L.join('\n');
}
function copyText(x){
  function fb(){var a=document.createElement('textarea');a.value=x;document.body.appendChild(a);a.select();try{document.execCommand('copy');toast(t('tCopied'))}catch(e){toast(t('tCopyFail'))}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(x).then(function(){toast(t('tCopied'))},fb); else fb();
}

function openSettings(){wsMark();$('#sGist').value=CFG.gist||'';$('#sToken').value=CFG.token||'';setInfo();$('#setOv').classList.remove('hidden')}

/* =====================================================================
   Session / boot
   ===================================================================== */
function hexB(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a}
function catB(a,b){var r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r}
function sha(b){return crypto.subtle.digest('SHA-256',b).then(function(x){return new Uint8Array(x)})}
async function unlockToken(code,lock){
  if(!lock||!lock.c||!window.crypto||!crypto.subtle) return null;
  var cb=new TextEncoder().encode(code), k=await sha(catB(hexB(lock.s),cb));
  for(var i=0;i<5000;i++) k=await sha(catB(k,cb));
  var ct=hexB(lock.c), out=new Uint8Array(ct.length), blk=0;
  for(var o=0;o<ct.length;o+=32){var st=await sha(catB(k,new Uint8Array([0,0,(blk>>8)&255,blk&255])));blk++;for(var j=0;j<32&&o+j<ct.length;j++)out[o+j]=ct[o+j]^st[j]}
  var x=new TextDecoder().decode(out);
  return /^(ghp_|github_pat_)[A-Za-z0-9_]+$/.test(x)?x:null;
}
function sessionOk(){var s=ls(K.sess);return s&&s.exp>Date.now()}
async function doLogin(){
  var c=$('#loginCode').value.trim().toLowerCase(); if(!c) return;
  $('#loginErr').textContent='';
  if(ACCESS_CODES.indexOf(c)>-1){
    if(CFG.tokenFromLock){delete CFG.token;delete CFG.tokenFromLock;ls(K.cfg,CFG)}
    ls(K.sess,{exp:Date.now()+SESSION_HOURS*3600e3,role:'view'}); return start();
  }
  var btn=$('#loginBtn'); btn.disabled=true; btn.textContent=t('checking');
  var tk=null, grp=null;
  for(var g in EDIT_LOCKS){ try{tk=await unlockToken(c,EDIT_LOCKS[g])}catch(e){tk=null} if(tk){grp=g;break} }
  btn.disabled=false; btn.textContent=t('signIn');
  if(!tk){$('#loginErr').textContent=t('wrongCode');return}
  if(VIEW_GROUPS.indexOf(grp)>-1){                 // กลุ่มดูอย่างเดียว — ไม่เก็บ token
    if(CFG.tokenFromLock){delete CFG.token;delete CFG.tokenFromLock;ls(K.cfg,CFG)}
    ls(K.sess,{exp:Date.now()+SESSION_HOURS*3600e3,role:'view',group:grp}); return start();
  }
  CFG.token=tk; CFG.tokenFromLock=true; ls(K.cfg,CFG);
  ls(K.sess,{exp:Date.now()+SESSION_HOURS*3600e3,role:'edit',group:grp}); start();
  if(!CFG.gist) setTimeout(createGist,400);
}
function logout(){if(ls('dap.sso')){lsDel('dap.sso');lsDel(K.sess);if(CFG.tokenFromLock){delete CFG.token;delete CFG.tokenFromLock;ls(K.cfg,CFG)}return d3oneSignOut()}lsDel(K.sess);if(CFG.tokenFromLock){delete CFG.token;delete CFG.tokenFromLock;ls(K.cfg,CFG)}location.reload()}
function applyLogo(){if(!LOGO_SRC)return;['#loginLogo','#topLogo'].forEach(function(s){$(s).innerHTML='<img alt="บพค." src="'+LOGO_SRC+'">'})}
function sbClose(){document.body.classList.remove('sbo')}
var started=false;
function start(){
  if(started) return; started=true;
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  if(!DB.items.length && !CFG.gist && !ls('dap.seeded')){
    var n=nowISO(); DB.items=SEED.map(function(s){var o=Object.assign({},s);o.id=uid();o.createdAt=n;o.updatedAt=n;return o}); saveDB(); ls('dap.seeded',1);
  }
  render();
  if(CFG.gist) pull(true);
  setInterval(function(){if(CFG.gist&&document.visibilityState==='visible'&&syncState!=='busy')pull(true)},POLL_MIN*60e3);
  document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&CFG.gist&&syncState!=='busy'){if(!sessionOk())return logout();pull(true)}});
}

  $('#loginBtn').onclick=doLogin;
  $('#loginCode').addEventListener('keydown',function(e){if(e.key==='Enter')doLogin()});
  $$('[data-lang]').forEach(function(g){g.onclick=function(e){var b=e.target.closest('button');if(b)setLang(b.dataset.l)}});
  $('#viewNav').onclick=function(e){var b=e.target.closest('.sbi');if(!b)return;sbClose();setView(b.dataset.v)};
  $('#sbBtn').onclick=function(){document.body.classList.toggle('sbo')};
  $('#scrim').onclick=sbClose;
  $('#typeChips').onclick=function(e){var b=e.target.closest('.chip');if(!b)return;var x=b.dataset.t;UI.types[x]=!UI.types[x];if(!UI.types.intl&&!UI.types.dom)UI.types[x==='intl'?'dom':'intl']=true;saveUI();render()};
  $('#cancChip').onclick=function(){UI.showCanc=!UI.showCanc;saveUI();render()};
  $('#pastChip').onclick=function(){UI.showPast=!UI.showPast;saveUI();render()};
  $('#prevBtn').onclick=function(){cursor=addMonths(cursor,-1);selDay=null;render()};
  $('#nextBtn').onclick=function(){cursor=addMonths(cursor,1);selDay=null;render()};
  $('#todayBtn').onclick=function(){cursor=monthStart(todayN());selDay=null;render()};
  var qt; $('#q').addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(render,150)});
  $('#view').addEventListener('click',function(e){
    var el=e.target.closest('[data-id]');
    if(el){var it=byId(el.dataset.id);if(it)openEdit(it);return}
    var d=e.target.closest('[data-day]');
    if(d){var n=+d.dataset.day;selDay=selDay===n?null:n;render();var dp=$('.dayp');if(dp&&window.innerWidth<700)dp.scrollIntoView({behavior:'smooth'})}
  });
  $('#view').addEventListener('dblclick',function(e){var d=e.target.closest('[data-day]');if(d&&canEdit()&&!e.target.closest('[data-id]')){var s=ds(+d.dataset.day);openEdit(null,{start:s,end:s})}});
  function addNew(){sbClose();openEdit(null,selDay!=null?{start:ds(selDay),end:ds(selDay)}:null)}
  $('#addBtn').onclick=addNew; $('#sbAdd').onclick=addNew;
  $('#sbSet').onclick=function(){sbClose();openSettings()};
  bindWith();
  $('#saveBtn').onclick=saveEdit; $('#delBtn').onclick=delEdit; $('#dupBtn').onclick=dupEdit;
  $$('#fType button').forEach(function(b){b.onclick=function(){setType(b.dataset.t)}});
  $$('#fStatus button').forEach(function(b){b.onclick=function(){setStatus(b.dataset.s)}});
  $('#fStart').addEventListener('change',function(){if(!$('#fEnd').value||$('#fEnd').value<$('#fStart').value)$('#fEnd').value=$('#fStart').value;liveWarn()});
  $('#fEnd').addEventListener('change',liveWarn);
  $$('[data-close]').forEach(function(b){b.onclick=closeOv});
  $$('.ov').forEach(function(o){o.addEventListener('mousedown',function(e){if(e.target===o)closeOv()})});
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeOv();sbClose()}if((e.ctrlKey||e.metaKey)&&e.key==='Enter'&&!$('#editOv').classList.contains('hidden'))saveEdit()});
  $('#syncPill').onclick=function(){if(CFG.gist)(DB.dirty&&CFG.token?push():pull(false));else openSettings()};
  $('#pushNow').onclick=push;
  $('#sSave').onclick=saveSettings; $('#sPull').onclick=function(){pull(false)};
  $('#sCreate').onclick=function(){var tk=$('#sToken').value.trim();if(tk&&tk!==CFG.token){CFG.token=tk;delete CFG.tokenFromLock;ls(K.cfg,CFG)}createGist()};
  $('#wsSel').onclick=function(e){var b=e.target.closest('button');if(!b)return;UI.weekStart=+b.dataset.w;saveUI();wsMark();render();toast(t('tWs'))};
  $('#xJson').onclick=exportJSON; $('#xCsv').onclick=exportCSV; $('#csvBtn').onclick=exportCSV;
  $('#iJson').onchange=function(){if(this.files[0])importJSON(this.files[0]);this.value=''};
  $('#copyBtn').onclick=function(){copyText(shareText())};
  $('#printBtn').onclick=function(){window.print()};
  $('#logoutBtn').onclick=logout;
  $('#verTxt').textContent=APP_VERSION;
  $('#dlCountry').innerHTML=COUNTRIES.map(function(c){return '<option value="'+esc(c[0]+' ('+c[1]+')')+'">'}).join('');
  $('#dlProvince').innerHTML=PROVINCES.map(function(p){return '<option value="'+esc(p)+'">'}).join('');
}

  if(sessionOk()) start(); else setTimeout(function(){$('#loginCode').focus()},50);
})();
